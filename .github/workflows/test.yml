name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RESEARCH_VALIDATOR_CACHE: ${{ github.workspace }}/.build/validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -e . -c constraints-py312.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m research_skills demo --output .runs/ci-demo
      - run: python -m research_skills survey-demo --output .runs/ci-survey-demo
      - run: python -m research_skills study-demo --output .runs/ci-study-demo --repeats 3
      - run: python examples/north-america-retail/reproduce.py --output .runs/ci-full-case
      - run: python examples/retrieval/reproduce.py --output .runs/ci-retrieval
      - run: python examples/north-america-retail/professional-v2/reproduce.py --output .runs/ci-professional-v2
      - run: python examples/north-america-retail/desk-v3/reproduce.py --output .runs/ci-desk-v3
