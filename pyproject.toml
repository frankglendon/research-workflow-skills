[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-workflow-skills"
version = "0.5.0"
description = "Seven research skills with persistent study, evidence and artifact gates"
requires-python = ">=3.10"
dependencies = ["openpyxl==3.1.5", "python-pptx==1.0.2", "lxml>=5"]

[project.scripts]
research-skills = "research_skills.cli:main"

[tool.setuptools.packages.find]
include = ["research_skills*"]

[tool.setuptools.package-data]
research_skills = ["validation/*.cs", "validation/*.csproj"]
